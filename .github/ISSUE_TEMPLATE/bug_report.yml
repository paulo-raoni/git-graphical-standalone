name: Bug report
description: Something in Trunks Graph does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting. Please don't attach screenshots of other applications, and leave out any private
        details of your repository (names, paths, e-mail addresses).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and git version
      placeholder: Windows 11, git 2.51.0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot of Trunks Graph, the repository size, logs.
